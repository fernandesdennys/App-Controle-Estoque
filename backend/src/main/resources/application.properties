spring.application.name=dispensa

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dispensa}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false

# Segredo do JWT — obrigatório vir de variável de ambiente, sem fallback
jwt.secret=${JWT_SECRET}

# Origens permitidas no CORS — dev local por padrão, produção via env var
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}